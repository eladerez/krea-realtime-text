# The core comparison (PLAN.md): Krea Realtime 14B against the model it was distilled from, Wan2.1-T2V-14B.
# All configs: 832x480, 16 fps, same prompts (prompts/prompts.jsonl), one RTX PRO 6000.
#   prompts: all | ref20 (the 20 prompts with targets OPEN, COFFEE, BOOK NOW, ADD TO CART: every scene, 4 lengths)
#   preflight: the prompts and seeds the timing run makes (its videos count toward the full run)

krea_rt:         # Krea Realtime 14B, the real-time setting from its model card: 4 denoising steps, ~5 s (7 blocks)
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3   # Krea's server default
  prompts: all
  seeds: [0, 1]
  preflight: {prompts: [screen_open, storefront_coffee, paper_book_now], seeds: [0]}

krea_rt_long:    # same model and settings, ~30 s (40 blocks): does text decay over a long session?
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  prompts: all
  seeds: [0]
  preflight: {prompts: [screen_open], seeds: [0]}

wan14b_ref:      # reference: Wan2.1-T2V-14B, bidirectional, 50 steps, CFG 5, shift 5, Wan's negative prompt (its defaults)
  backend: wan
  steps: 50
  guidance: 5.0
  flow_shift: 5.0
  frames: 81
  prompts: ref20
  seeds: [0]
  preflight: {prompts: [screen_open, storefront_coffee, paper_book_now], seeds: [0]}

vae_ceiling:     # D1: text clips at 12-72 px through Wan's VAE only (scripts/vae_ceiling.py), no generation
  backend: vae

# Solaris-hard set (prompts/hard.jsonl): text-heavy pages, small text, numbers, changing text. Same models and settings.
krea_rt_hard:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/hard.jsonl
  seeds: [0, 1]
  preflight: {prompts: [dense_shop], seeds: [0]}

krea_rt_long_hard:
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  prompt_file: prompts/hard.jsonl
  seeds: [0]
  preflight: {prompts: [dense_shop], seeds: [0]}

wan14b_ref_hard:
  backend: wan
  steps: 50
  guidance: 5.0
  flow_shift: 5.0
  frames: 81
  prompt_file: prompts/hard.jsonl
  seeds: [0]
  preflight: {prompts: [dense_shop], seeds: [0]}

# D2, text anchor (runner/gen_krea.py AnchoredSession): same as the long configs, plus the anchor.
krea_rt_long_anchor:
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  anchor: text
  prompts: all
  seeds: [0]
  preflight: {prompts: [screen_open], seeds: [0]}

krea_rt_long_hard_anchor:
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  anchor: text
  prompt_file: prompts/hard.jsonl
  seeds: [0]
  preflight: {prompts: [dense_shop], seeds: [0]}

# Why does "ADD TO CART" fail? Phrases with and without 2-letter words (prompts/phrases.jsonl), 2 scenes x 12 phrases.
krea_rt_phrases:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/phrases.jsonl
  seeds: [0, 1]
  preflight: {prompts: [screen_add_to_cart], seeds: [0]}

# OCR checker in the loop (gen_krea.py generate(verify=...)): a block whose text is visible but misspelled is
# generated again from the same state with new noise, up to 4 tries. Same prompts and seeds as the plain configs.
krea_rt_phrases_verify:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  verify: true
  verify_tries: 4
  prompt_file: prompts/phrases.jsonl
  seeds: [0, 1]
  preflight: {prompts: [screen_add_to_cart], seeds: [0]}

krea_rt_hard_verify:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  verify: true
  verify_tries: 4
  prompt_file: prompts/hard.jsonl
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

# Step 8: Wan's side of the phrase test (same 24 prompts, seed 0): is the 2-letter-word failure the base model's or
# the real-time recipe's?
wan14b_ref_phrases:
  backend: wan
  steps: 50
  guidance: 5.0
  flow_shift: 5.0
  frames: 81
  prompt_file: prompts/phrases.jsonl
  seeds: [0]
  preflight: {prompts: [screen_add_to_cart], seeds: [0]}

# Step 9, Runway's hybrid ("image models render text-heavy views whenever a brief pause is acceptable, while video
# models handle continuous interaction"): Qwen-Image renders the text-heavy view, Krea animates from it.
# Hard set without the changing-text prompts (12 prompts: dense, small, numbers).
qwen_frames:
  backend: qwen
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_hybrid:          # vs krea_rt_hard on the same prompts and seeds
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: true
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_long_hybrid_anchor:   # vs krea_rt_long_hard and krea_rt_long_hard_anchor (seed 0)
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  start_frame: true
  anchor: text
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0]
  preflight: {prompts: [numbers_price], seeds: [0]}

# D2 variant (Elad, 26 Oct 2026: "Add it"): on text-heavy pages the "all targets right" anchor fired in 1 of 16
# videos. This one anchors the frame with the most targets right so far and replaces it when a better one appears.
krea_rt_long_hard_anchor_best:
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  anchor: best
  prompt_file: prompts/hard.jsonl
  seeds: [0]
  preflight: {prompts: [dense_shop], seeds: [0]}

# Step 10 (Elad, 27 Oct 2026: "I want you to try with FLUX.1 kontext"): the same hybrid with FLUX.1 Kontext [dev]
# as the image model (runner/gen_kontext.py), two ways. Same 12 prompts and seeds as step 9.
#   draw: Kontext draws the view from the prompt (Qwen-Image's job in step 9)
#   fix:  Kontext edits the frame the plain Krea video showed (krea_rt_hard, frame 8 = 0.5 s) to correct its text
kontext_draw:
  backend: kontext
  mode: draw
  out: data/start_frames_kontext_draw
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

kontext_fix:
  backend: kontext
  mode: fix
  source: krea_rt_hard
  source_frame: 8
  out: data/start_frames_kontext_fix
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_hybrid_kontext_draw:          # vs krea_rt_hybrid (Qwen) and krea_rt_hard
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: data/start_frames_kontext_draw
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_hybrid_kontext_fix:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: data/start_frames_kontext_fix
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_long_hybrid_kontext_draw_anchor:   # vs krea_rt_long_hybrid_anchor (Qwen), seed 0
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  start_frame: data/start_frames_kontext_draw
  anchor: text
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_long_hybrid_kontext_fix_anchor:
  backend: krea
  steps: 4
  blocks: 40
  kv_cache_num_frames: 3
  start_frame: data/start_frames_kontext_fix
  anchor: text
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0]
  preflight: {prompts: [numbers_price], seeds: [0]}

# Step 11 (Elad, 27 Oct 2026: "queue step 11 on the GCP"): fix Krea's frame label by label. Step 10's single
# instruction made Kontext write every target into the menu bar. prompts/fix_labels.json (OCR of each frame, built on
# the Jetson by prompts/make_fix_labels.py) gives one 'Replace "X" with "Y"' per misspelled label. Two editors:
# Kontext at guidance 3.5 (model card 2.5; more weight on the instruction) and Qwen-Image-Edit (Apache-2.0, the edit
# model of Qwen-Image, whose stills were 98% right in step 9). Same 12 prompts x 2 seeds; Krea 5 s from each.
kontext_fix_labels:
  backend: kontext
  mode: fix_labels
  guidance: 3.5
  source: krea_rt_hard
  source_frame: 8
  out: data/start_frames_kontext_fix_labels
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

qwenedit_fix_labels:
  backend: qwen_edit
  editor: qwen_edit
  mode: fix_labels
  source: krea_rt_hard
  source_frame: 8
  out: data/start_frames_qwenedit_fix_labels
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_hybrid_kontext_fix_labels:     # vs krea_rt_hybrid_kontext_fix (step 10) and krea_rt_hybrid (Qwen draw)
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: data/start_frames_kontext_fix_labels
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

krea_rt_hybrid_qwenedit_fix_labels:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: data/start_frames_qwenedit_fix_labels
  prompt_file: prompts/hard.jsonl
  kinds: [dense, small, numbers]
  seeds: [0, 1]
  preflight: {prompts: [numbers_price], seeds: [0]}

# Step 12 (Elad, 27 Oct 2026: "queue the Helios as step 12"): Helios-Distilled 14B (runner/gen_helios.py), a 2026
# real-time model with a different design from Krea, on the same prompts. 640x384 and 24 fps are its own defaults
# (Krea: 832x480, 16 fps), so its letters get ~0.8x the pixels per side. 132 frames = 4 chunks = 5.5 s; 726 = 30 s.
helios_hard:          # vs krea_rt_hard
  backend: helios
  frames: 132
  prompt_file: prompts/hard.jsonl
  seeds: [0, 1]
  preflight: {prompts: [dense_shop], seeds: [0]}

helios_phrases:       # vs krea_rt_phrases and wan14b_ref_phrases: the middle-word swap
  backend: helios
  frames: 132
  prompt_file: prompts/phrases.jsonl
  seeds: [0, 1]
  preflight: {prompts: [screen_add_to_cart], seeds: [0]}

helios_long_hard:     # vs krea_rt_long_hard: drift over 30 s
  backend: helios
  frames: 726
  prompt_file: prompts/hard.jsonl
  seeds: [0]
  preflight: {prompts: [dense_shop], seeds: [0]}

# Step 13 (Elad, 28 Oct 2026: "yes"): does camera motion cost text? Solaris moves the camera (rotate, zoom, pan); our
# other sets mostly asked for a steady shot. prompts/camera.jsonl: 4 scenes x 3 texts x 4 moves (steady, pan, push,
# orbit), the same scene and text with only the camera sentence changed. Krea, same settings as krea_rt.
krea_rt_camera:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/camera.jsonl
  seeds: [0, 1]
  preflight: {prompts: [screen_open_pan], seeds: [0]}

# Step 14 (Elad, 28 Oct 2026: "VTR-Bench", smoke test first): Krea on the published VTR-Bench (github.com/hardenyu21/
# VTR-Bench @ 2ee26e7), scored by its own evaluator (Qwen3.8-27B judge, WER and 20-question Video Score).
# Smoke test: 10 prompts, 2 per category (prompts/vtr_smoke.jsonl). Krea from the prompt alone, and Krea's best run
# (from a start picture, as krea_rt_hybrid). Same Krea settings as krea_rt (5 s).
qwen_vtr_smoke:
  backend: qwen
  out: data/start_frames_vtr
  prompt_file: prompts/vtr_smoke.jsonl
  seeds: [0]
  preflight: {prompts: [UI-0001], seeds: [0]}

krea_rt_vtr_smoke:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/vtr_smoke.jsonl
  seeds: [0]
  preflight: {prompts: [UI-0001], seeds: [0]}

krea_rt_vtr_smoke_hybrid:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  start_frame: data/start_frames_vtr
  prompt_file: prompts/vtr_smoke.jsonl
  seeds: [0]
  preflight: {prompts: [UI-0001], seeds: [0]}

vtr_eval_smoke:       # runs VTR-Bench's evaluator on the configs below, after they are generated (same VM)
  backend: vtr
  evaluate: [krea_rt_vtr_smoke, krea_rt_vtr_smoke_hybrid]

# Step 15 (Elad, 28 Oct 2026: "Test both ways to do a click"): text that changes on an interaction, Solaris-style.
# prompts/interaction.jsonl: 6 actions x 2 screens x 2 ways (one_prompt; switch: gen_krea.py swaps the prompt at a
# block, as Solaris's language model rewrites it). Scored by scripts/interaction_summary.py.
krea_rt_interaction:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/interaction.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_cart_switch], seeds: [0]}

# Step 16 (Elad, 28 Oct 2026: "Do it"): in step 15 the text never followed a prompt switch (0/20): Krea's memory copied
# the old text forward. Here the memory is cleared at the switch (gen_krea.py, reset): a fresh Krea session on the new
# prompt for the remaining blocks, either from nothing ("full") or from the current frame blurred so letters are gone
# but layout stays ("blur", Gaussian radius 12: radius 8 left "HOME" readable to OCR). Switch rows only.
krea_rt_interaction_reset_blur:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  reset: blur
  blur_radius: 12
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_cart_switch], seeds: [0]}

krea_rt_interaction_reset_full:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  reset: full
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_cart_switch], seeds: [0]}

# Step 17 (Elad, 28 Oct 2026: "Do 1 and 2 and then 3"): change only the text in Krea's memory at the switch.
# textbench/erase.py finds the old text by OCR on the newest frame and fills its box with the label's own background.
#   erase_restart: option 1, a fresh session from the current frame with only the old text erased (sharp otherwise)
#   erase_memory:  option 2, no restart: the old text is erased in Krea's pixel cache and the last two latents are
#                  re-encoded from it (gen_krea.py edit_memory); the session continues with the new prompt
krea_rt_interaction_erase_restart:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  reset: erase
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

krea_rt_interaction_erase_memory:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: erase
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

# Step 18, option 3: no restart and no edit; at the switch the old text's tokens are hidden from the denoising
# attention (gen_krea.py masked_attention) for the next 2 blocks, so new frames cannot copy it from memory.
krea_rt_interaction_mask_attention:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: mask
  mask_blocks: 2
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

# Steps 15-18 second reader (Elad, 29 Oct 2026: "Do all"): VTR-Bench's judge model reads the text before and after the
# click and compares the scene (runner/judge_clips.py). All click and typing videos.
judge_interaction:
  backend: judge
  evaluate: [krea_rt_interaction, krea_rt_interaction_reset_blur, krea_rt_interaction_reset_full,
             krea_rt_interaction_erase_restart, krea_rt_interaction_erase_memory, krea_rt_interaction_mask_attention]

# Step 20 (Elad, 30 Oct 2026: "Do all options"): put the new text, the exact string a Solaris-style language model
# knows, into Krea at the click (textbench/write_text.py draws it where the old text was, in its colour and size).
#   write_memory:  option 1, written into the memory (9 cached frames + last two latents), then continue
#   write_anchor:  option 2, the same plus the written frame kept in the oldest memory slot for the rest of the video
#   guide_written: option 3, memory untouched; the new frames are steered towards the written text between
#                  denoising passes for 2 blocks (all passes but the last)
krea_rt_interaction_write_memory:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

krea_rt_interaction_write_anchor:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write_anchor
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

krea_rt_interaction_guide_written:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  guide: written_text
  guide_blocks: 2
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

judge_write:
  backend: judge
  evaluate: [krea_rt_interaction_write_memory, krea_rt_interaction_write_anchor, krea_rt_interaction_guide_written]

judge_write_v2:      # step 20 rerun with inside-the-box colours
  backend: judge
  evaluate: [krea_rt_interaction_write_memory, krea_rt_interaction_write_anchor]

# Step 21 (Elad, 30 Oct 2026: "Run it now"): like W1/W2 but only the characters that differ are changed (CART 2 ->
# CART 3: only the digit); Krea's own letters stay. Falls back to rewriting the whole label when the letters cannot
# be separated or OCR does not read the edit. Tested on 16 step-15 frames: 16/16 read, 9 partial, 7 full.
krea_rt_interaction_write_partial:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write
  write_partial: true
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

krea_rt_interaction_write_partial_anchor:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write_anchor
  write_partial: true
  prompt_file: prompts/interaction_switch.jsonl
  seeds: [0, 1]
  preflight: {prompts: [laptop_toggle_switch], seeds: [0]}

judge_write_partial:
  backend: judge
  evaluate: [krea_rt_interaction_write_partial, krea_rt_interaction_write_partial_anchor]

# Step 22 (Elad, 30 Oct 2026: "Run Solaris like scenes"): the click test in busy, moving scenes modelled on Solaris's
# demos (prompts/solaris.jsonl: try-on mirror, living-room TV, salad bar, online store, delivery app, station board,
# arena scoreboard; 6 of 8 with camera or hand motion). Switch only vs the step-21 fixes (changed characters only).
krea_rt_solaris:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  prompt_file: prompts/solaris.jsonl
  seeds: [0, 1, 2]
  preflight: {prompts: [store_push_switch], seeds: [0]}

krea_rt_solaris_write:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write
  write_partial: true
  prompt_file: prompts/solaris.jsonl
  seeds: [0, 1, 2]
  preflight: {prompts: [store_push_switch], seeds: [0]}

krea_rt_solaris_write_anchor:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write_anchor
  write_partial: true
  prompt_file: prompts/solaris.jsonl
  seeds: [0, 1, 2]
  preflight: {prompts: [store_push_switch], seeds: [0]}

judge_solaris:
  backend: judge
  evaluate: [krea_rt_solaris, krea_rt_solaris_write, krea_rt_solaris_write_anchor]
  prompt_file: prompts/solaris.jsonl
  answers: answers_solaris.jsonl
  where: in the scene (screens, signs, boards and labels)

# Step 22b (Elad, 31 Oct 2026: "In the train station the text floats with the camera movement"): the memory frames
# move with the camera (station board: 11-17 px across the 9), but the text was pasted at the newest frame's spot in
# all 9, so Krea kept it fixed to the screen. track_boxes: each older frame gets the box where its area moved
# (textbench/write_text.py track_boxes). Offline on the real memory frames: within 0-4 px of the scene's shift.
krea_rt_solaris_write_track:
  backend: krea
  steps: 4
  blocks: 7
  kv_cache_num_frames: 3
  memory_edit: write
  write_partial: true
  track_boxes: true
  prompt_file: prompts/solaris.jsonl
  seeds: [0, 1, 2]
  preflight: {prompts: [station_board_switch], seeds: [2]}

judge_solaris_track:
  backend: judge
  evaluate: [krea_rt_solaris_write_track]
  prompt_file: prompts/solaris.jsonl
  answers: answers_solaris_track.jsonl
  where: in the scene (screens, signs, boards and labels)

# Step 23 (Elad, 31 Oct 2026: "I want to test how close can I get to Solaris and then solve the text problem", "Do a
# and b"): Solaris's own demos (prompts/solaris2.jsonl), 13 blocks, with and without a Qwen-Image start frame (Solaris's
# "starting state"). Phase A: switch only. Phase B: the text fix (changed characters, tracked boxes, matched font
# weight and width) on the 4 text scenes. Judge: the post's two user-study questions plus the text reads.
qwen_solaris2:
  backend: qwen
  out: data/start_frames_solaris2
  prompt_file: prompts/solaris2.jsonl
  seeds: [0, 1]
  preflight: {prompts: [salad_switch], seeds: [0]}

krea_rt_solaris2:
  backend: krea
  steps: 4
  blocks: 13
  kv_cache_num_frames: 3
  prompt_file: prompts/solaris2.jsonl
  seeds: [0, 1]
  preflight: {prompts: [salad_switch], seeds: [0]}

krea_rt_solaris2_start:
